<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz game</title>
    <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
    <div id="quiz_container"></div>
    <script src="/src/js/scripts.js"></script>

    <section id="inicio"> 
        <h1>Bem vindo(a) ao quiz geek!</h1>
        <button id="start">Começar</button>
    </section>

    <section class="tela-quiz" hidden>
        <h2 id="questions"></h2>
        <div id="answers">
            <input type="text" id="user-answer" placeholder="Digite sua resposta">
            <button id="submit">Responder</button>
        </div>

    </section>
</html>
